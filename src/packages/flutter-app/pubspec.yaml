name: travel_route_planner
description: "Anemos - Plan trips, optimize routes, and build itineraries with AI."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Grapheme-cluster truncation in PendingPromptStore (already pinned by
  # Flutter itself; direct dependency so the import is honest).
  characters: ^1.0.0
  # Path-style web URLs (usePathUrlStrategy in main.dart).
  flutter_web_plugins:
    sdk: flutter
  # Localization (specs/i18n-spanish): gen_l10n delegates + Material/Cupertino
  # translations. GlobalMaterialLocalizations also initializes intl's date
  # symbols for the active locale, so DateFormat works without a manual
  # initializeDateFormatting call.
  flutter_localizations:
    sdk: flutter
  # Locale-aware date and number formatting (utils/trip_format.dart,
  # utils/money_format.dart).
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  
  # HTTP client for API calls
  http: ^1.1.0
  
  # State management
  flutter_riverpod: ^2.4.0
  
  # JSON serialization
  json_annotation: ^4.8.1
  
  # Secure on-device storage for the session token. Keep at v10+: its web
  # implementation is js_interop-based, while 9.x's dart:html one is the
  # repo's sole dart2wasm blocker (specs/perf-program deferred --wasm
  # experiment; probed 2026-08-26 — everything else compiles).
  flutter_secure_storage: ^10.3.1

  # Plain on-device storage (last viewed trip)
  shared_preferences: ^2.3.0

  # Open external Airbnb/Booking links
  url_launcher: ^6.3.0

  # Native OS share sheet for trip links (mobile; web/desktop copy instead)
  share_plus: ^12.0.2

  # Render airline logos (Duffel serves them as SVG)
  flutter_svg: ^2.0.10

  # Sticky city/day section headers in scroll views (MultiSliver + SliverPinnedHeader)
  sliver_tools: ^0.2.12

  # Markdown rendering for streamed assistant chat replies
  gpt_markdown: ^1.1.7

  # Interactive map (OpenStreetMap tiles) for trip itineraries
  flutter_map: ^8.0.0
  flutter_map_marker_cluster: ^8.2.2
  latlong2: ^0.9.1
  speech_to_text: ^7.4.0
  record: ^6.2.1

  # Chat image attachments (specs/chat-image-attachments)
  desktop_drop: ^0.6.1 # drag-drop target (web + desktop; no-op on mobile)
  file_picker: ^10.3.3 # paperclip button; uniform bytes on web/desktop/gallery
  image: ^4.3.0 # pure-Dart ENCODING of already-downscaled pixels only
  web: ^1.1.1 # paste-from-clipboard listener (clipboard_images_web.dart)

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Fake-clock provider tests (boot_burst_providers_test.dart); already in
  # the resolution via flutter_test, declared so imports are direct.
  fake_async: ^1.3.3

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  
  # JSON code generation
  json_serializable: ^6.7.1
  build_runner: ^2.4.7

  # Faking the URL launcher in widget tests (tracked_launch_test.dart)
  url_launcher_platform_interface: ^2.3.2

  # Generates native (iOS/Android) launch screens from the config below.
  # Rerun `dart run flutter_native_splash:create` after changing it.
  flutter_native_splash: ^2.4.1
  # Launcher icons for all native targets, seeded from the maskable PWA icon
  # (wind rose on white — the rose is bronze/azure, so a teal background
  # would have no contrast for the thread). Rerun
  # `dart run flutter_launcher_icons` after re-rendering brand art
  # (scripts/brand-render.sh).
  flutter_launcher_icons: ^0.14.1

# Native launch screens (iOS/Android) shown while the engine boots, before the
# in-app SplashScreen takes over. Solid Aegean night #0C1F2C — the same field
# the web and in-app splash paint (a solid is all native can express, and a
# solid is now all there is) + the same bare light mark as the web
# splash (assets/splash/mark_light_4x.png, 512px = 4x the 128dp mark — no white
# plate). Android 12+ masks its icon to a circle, so it gets its own safe-zone
# seed (mark_light_android12.png, a 741px mark centered on a 1152px canvas —
# sized by the ink's radius against Android's 768px circle, NOT by matching the
# box to it) — pinned by that mask, so it does not follow the in-app mark size.
# web: false — index.html has its own hand-crafted splash.
flutter_native_splash:
  color: "#0C1F2C"
  image: assets/splash/mark_light_4x.png
  web: false
  android_12:
    color: "#0C1F2C"
    image: assets/splash/mark_light_android12.png

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Generate AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    # Its own entry — Flutter's directory declaration is NOT recursive.
    # Generated by scripts/fetch-destination-photos.py; the .md is listed with
    # them so the credits ship next to the images they describe.
    - assets/images/destinations/

  # Two faces, three jobs (see lib/theme/app_typography.dart). All bundled
  # and subsetted — never google_fonts, which prod CSP blocks.
  #
  # Cormorant Garamond (OFL) — the wordmark AND the heading/display face:
  # w600 for the wordmark, w500 for headings. Both are static instances of the
  # variable font, Latin-subsetted (see docs/branding/README.md). ONE family
  # entry, two real weights — a second family entry would let the two drift.
  fonts:
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
    # Inter (OFL) — the UI font: body, labels, buttons, numbers.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Launcher icons (all platforms) — seed regenerated by scripts/brand-render.sh.
flutter_launcher_icons:
  image_path: web/icons/Icon-maskable-512.png
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: web/icons/Icon-maskable-512.png
  windows:
    generate: true
    image_path: web/icons/Icon-maskable-512.png
