<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <!-- Legacy hash-URL shim: pre-path-strategy links look like /#/share/abc.
       Rewrite them to the real path (base-href aware) before the Flutter
       engine reads the URL, so old links in chats and emails keep working. -->
  <script>
    if (location.hash.startsWith('#/')) {
      var base = document.querySelector('base').getAttribute('href') || '/';
      history.replaceState(null, '',
          base.replace(/\/$/, '') + location.hash.slice(1) + location.search);
    }
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- The boot splash's scale depends on this tag existing BEFORE the engine
       does. Flutter injects exactly this content itself once it boots, so the
       app has always ended up correct — but the splash below paints for
       seconds first, and without a viewport a phone lays the document out in a
       980px virtual viewport and scales it to fit. On a 390px screen that is
       0.4x: the 128px mark painted 45px and the wordmark was barely legible,
       then snapped to full size mid-boot when the engine injected its own copy.
       One splash, one geometry, two scales — the "small logo that grows" was
       this and nothing else.

       Content is Flutter's string verbatim, not a considered variant: matching
       it is the point, because anything else reintroduces a reflow at the
       handoff. If a future Flutter changes what it injects, change this with
       it. (maximum-scale/user-scalable are Flutter's call, not a
       pinch-zoom policy chosen here.) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="description" content="Plan trips and build day-by-day itineraries with an AI travel assistant.">

  <!-- SEO / social sharing (app landing; per-trip share links are prerendered
       server-side via /api/v1/share-preview and don't use these). -->
  <link rel="canonical" href="https://anemos.travel/app/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Anemos">
  <meta property="og:title" content="Anemos">
  <meta property="og:description" content="Plan trips and build day-by-day itineraries with an AI travel assistant.">
  <meta property="og:url" content="https://anemos.travel/app/">
  <meta property="og:image" content="https://anemos.travel/app/og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Anemos">
  <!-- The ?v= series dates from when nginx served /app/icons/* immutable for a
       year; nginx is now no-cache, but Cloudflare still caches these by URL, so
       this is what actually busts them. manifest.json and the splash <img>
       below carry the same version — move all three together.

       **Bump this on any deploy that changes the art, even if the last bump has
       not been released yet.** 4 was set for the mark-size pass and shipped;
       the Threaded Bezel swap then rewrote every icon and kept 4, reasoning
       the bump was still unreleased. It was not — the size pass had merged and
       deployed in between — so `favicon.png?v=4` served the previous mark from
       edge cache with `age: 3322` after the bezel went live. The version is
       cheap; a stale favicon lasts weeks in Chrome. -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=5">

  <!-- Favicon: ?v=5 because Chrome's favicon cache is keyed by URL and
       refreshes lazily — new bytes at the same URL can stay stale for weeks. -->
  <link rel="icon" type="image/png" href="favicon.png?v=5"/>

  <title>Anemos</title>
  <link rel="manifest" href="manifest.json">
  <!-- Browser chrome tint: the splash's flat Aegean-night field, in both OS
       modes — the splash commits to the one dark field regardless of theme,
       so the chrome matches the boot's first frame. A single unqualified
       meta; it used to take a media pair when the field followed the OS. -->
  <meta name="theme-color" content="#0C1F2C">

  <!--
    Boot splash shown while flutter_bootstrap.js + main.dart.js download and
    the engine starts. Pixel-matched to the in-app SplashScreen (lib/screens/
    splash_screen.dart) — same Aegean-night field, mark geometry (128px bare
    light mark, no plate, centre 28px above viewport centre), pulse, wordmark (centre
    80px below viewport centre) and bottom loading dots — so the
    flutter-first-frame handoff reads as one continuous screen. If you change
    dimensions here, change splash_screen.dart too.

    The mark + wordmark lockup rides high of centre so the pair reads
    optically centred as one unit; the loading signal is three breathing
    dots parked at the bottom edge, outside the brand moment, so a fast boot
    shows a still composition and a slow one still reads deliberately alive.

    The native mobile splash (flutter_native_splash) deliberately stays
    mark-only: it cannot render text, and web is the primary surface.
  -->
  <style>
    @font-face {
      /* The brand wordmark, from the very same file the Flutter build
         publishes (it is in FontManifest.json and the service-worker
         precache), so there is no second copy to keep in sync and no CSP
         problem: same-origin satisfies `font-src 'self'`, while Google Fonts
         would be blocked by `style-src` regardless.

         The path is a Flutter build-layout detail. If an engine upgrade
         reshuffles assets/, this silently falls back to the serif stack
         below — check here if the splash wordmark ever stops matching. */
      font-family: 'Cormorant Garamond';
      src: url('assets/assets/fonts/CormorantGaramond-SemiBold.ttf') format('truetype');
      font-weight: 600;
      /* This layer paints before flutter_bootstrap.js, so the ~80 KB face is a
         fresh fetch: show the fallback immediately rather than a blank gap. */
      font-display: swap;
    }
    html {
      /* Paints before anything else — no white flash. */
      background-color: #0C1F2C;
      height: 100%;
    }
    body {
      margin: 0;
      height: 100%;
      background-color: #0C1F2C;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0C1F2C;
      opacity: 1;
      transition: opacity 300ms ease-out;
      pointer-events: none;
    }
    #splash.splash-hidden { opacity: 0; }
    .splash-mark {
      position: absolute;
      /* 28px above centre: the mark + wordmark lockup below is 184px tall
         (128 mark + 32 clear space + 24 caps), so lifting the mark drops the
         pair's optical centre onto the viewport centre instead of hanging it
         low. The three numbers here — 128, -28, +80 — are derived as a set in
         splash_screen.dart's class doc; change them together, in both files. */
      top: calc(50% - 28px);
      left: 50%;
      /* The pulse animates `transform`, so the keyframes must repeat this
         centering translate or the animation stomps it. */
      transform: translate(-50%, -50%);
      width: 128px;
      height: 128px;
      display: grid;
      place-items: center;
      animation: splash-pulse 1.8s ease-in-out infinite alternate;
    }
    .splash-mark img {
      width: 128px;
      height: 128px;
      object-fit: contain;
    }
    @keyframes splash-pulse {
      from { transform: translate(-50%, -50%) scale(1); }
      to   { transform: translate(-50%, -50%) scale(1.04); }
    }
    .splash-wordmark {
      position: absolute;
      /* Centre line 80px below viewport centre: 108px below the lifted
         mark's, which keeps 32px (25% of the 128px mark height — the
         guideline's clear space) between the mark's bottom edge and the caps.
         Deliberately NOT inside .splash-mark: that element pulses, and the
         wordmark should not. */
      top: calc(50% + 80px);
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      font-weight: 600;
      font-size: 22px;
      letter-spacing: 3px;
      /* text-transform: Cormorant Garamond HAS a true lowercase, so the
         full-caps wordmark must come from the string — BrandWordmark paints
         AppInfo.name.toUpperCase() in-app, and this transform is the splash
         twin of it. (Under the old Cinzel this was deliberately absent:
         Cinzel had no lowercase and painted small caps, so uppercasing only
         here made the twins disagree.) */
      text-transform: uppercase;
      color: #FFFFFF;
      white-space: nowrap;
    }
    .splash-dots {
      position: absolute;
      /* Parked at the bottom edge, clear of the brand moment; the safe-area
         term keeps it above the home indicator in installed-PWA fullscreen. */
      bottom: calc(48px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
    }
    .splash-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #FFFFFF;
      opacity: 0.25;
      animation: splash-dot 1.8s ease-in-out infinite;
    }
    /* Negative delays start the wave mid-cycle — steady state from the very
       first frame, matching the Flutter twin's modulo phase (300ms
       left-to-right stagger on the pulse's own 1.8s rhythm). */
    .splash-dot:nth-child(2) { animation-delay: -1.5s; }
    .splash-dot:nth-child(3) { animation-delay: -1.2s; }
    @keyframes splash-dot {
      0%, 100% { opacity: 0.25; }
      50%      { opacity: 0.85; }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-mark, .splash-dot { animation: none; }
      /* The wave's midpoint, so the still state matches the Flutter twin. */
      .splash-dot { opacity: 0.55; }
    }
  </style>

</head>
<body>
  <div id="splash">
    <div class="splash-mark">
      <!-- Empty alt: the wordmark below is the visible, readable name, so a
           labelled image here would just announce "Anemos" twice.

           ?v= for the same reason the icons above carry one, and it was missing
           here until the Threaded Bezel swap: brand-render.sh rewrites this
           file whenever the mark art changes, at a path Cloudflare caches, so
           the boot splash served the PREVIOUS mark from edge cache for ~15
           minutes after that deploy. Bump it with the icons. -->
      <img src="splash/anemos_mark_light.png?v=5" alt="">
    </div>
    <div class="splash-wordmark">Anemos</div>
    <!-- Decorative: the loading state is announced by the app once it boots;
         these dots are the visual signal only. -->
    <div class="splash-dots" aria-hidden="true">
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
    </div>
  </div>

  <script>
    // Fade the boot splash out once Flutter paints its first frame (the in-app
    // SplashScreen, pixel-matched to the markup above).
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('splash-hidden');
      var remove = function () { splash.remove(); };
      splash.addEventListener('transitionend', remove, { once: true });
      setTimeout(remove, 600); // fallback if transitionend never fires
    });
  </script>

  <script>
    // Password-manager autofill shim (v3). Flutter web only gives the
    // *focused* text field a real DOM rect; its AutofillGroup siblings are
    // left at 0x0 (upstream flutter/flutter#61301, #127694). Password
    // managers run anti-phishing visibility checks per field — including an
    // occlusion check: elementFromPoint(field center) must return the field
    // itself (Bitwarden's DomElementVisibilityService; 1Password behaves
    // the same). elementFromPoint skips pointer-events:none elements, so
    // siblings must be pe:auto to qualify — and because the engine ignores
    // pointer events not targeted at its own surface, we intercept pointer
    // events on the siblings and re-dispatch clones at the engine element
    // beneath, so a user click on a sibling still focuses the right
    // Flutter field.
    (function () {
      // Perf gate (v3.3): the shim's expensive work (forced-reflow
      // getBoundingClientRect/getComputedStyle in sizeAutofillForm, the
      // 200 ms relay poll) only matters while an auth screen's autofill
      // form is in the DOM — those flt-text-editing-host form fields exist
      // ONLY on auth screens. `active` flips on via the capture-phase
      // focusin listener below and back off after ~25 consecutive relay
      // ticks (~5 s) find no autofill form. While dormant, non-auth
      // screens pay exactly one boolean read per mutation batch and run
      // NO polling interval.
      var active = false;
      var relayTimer = null;
      var idleTicks = 0;
      var AUTOFILL_PROBE =
          'flt-text-editing-host form input, flt-text-editing-host form textarea';
      var diagnosed = new WeakSet();
      var forwarded = new WeakSet();
      // Last value the engine is known to have ingested per input — kept in
      // sync by the input listener below; the relay poll compares against it.
      var lastSeen = new WeakMap();
      function logFillEvent(e) {
        // Verbose-level breadcrumbs for debugging real password-manager
        // behavior (DevTools console, "Verbose" filter, search "autofill").
        lastSeen.set(e.target, e.target.value || '');
        if (!active) return; // breadcrumbs only while an auth form is live
        console.debug('[autofill] ' + e.type +
            ' on ' + (e.target.getAttribute('autocomplete') || e.target.name) +
            ' len=' + (e.target.value || '').length +
            ' trusted=' + e.isTrusted +
            ' inputType=' + (e.inputType || '-'));
      }
      // 1Password writes values into the inputs WITHOUT dispatching DOM
      // events (Chrome still marks the fields autofilled, but Flutter's
      // engine only ingests values via events, so the fill never reached
      // Flutter state). Poll the autofill form's inputs and synthesize the
      // input event for any value that changed with no event — the engine's
      // own listener then ingests it. Duplicate delivery for event-ful
      // writes is harmless: same-value updates are dropped app-side.
      // The interval is NOT started at boot: focusin on an auth form starts
      // it (see the activation listener at the bottom) and ~25 consecutive
      // empty ticks (~5 s after the auth form leaves the DOM) stop it.
      function relayTick() {
        var probe = document.querySelector(AUTOFILL_PROBE);
        if (!probe) {
          if (++idleTicks >= 25) { // ~5 s with no auth form: go dormant
            active = false;
            clearInterval(relayTimer);
            relayTimer = null;
          }
          return;
        }
        idleTicks = 0;
        var fields = probe.form.querySelectorAll('input, textarea');
        for (var i = 0; i < fields.length; i++) {
          var el = fields[i];
          if (el.type === 'submit') continue;
          var value = el.value || '';
          if (!lastSeen.has(el)) {
            lastSeen.set(el, value);
            continue;
          }
          if (lastSeen.get(el) === value) continue;
          lastSeen.set(el, value);
          console.debug('[autofill] relay silent write on ' +
              (el.getAttribute('autocomplete') || el.name) +
              ' len=' + value.length);
          el.dispatchEvent(new InputEvent('input', {
            bubbles: true,
            composed: true,
            inputType: 'insertReplacementText',
            data: value,
          }));
        }
      }
      // A pointer event landed on a non-focused autofill input. Cancel it
      // (also suppresses the compatibility mouse events) and re-dispatch a
      // clone at whatever the engine has under that point, found by
      // momentarily making this input click-transparent.
      function forwardToFlutter(e) {
        var el = e.currentTarget;
        if (el.classList.contains('flt-text-editing')) return; // now focused
        e.preventDefault();
        e.stopImmediatePropagation();
        el.style.pointerEvents = 'none';
        var under = document.elementFromPoint(e.clientX, e.clientY);
        el.style.pointerEvents = 'auto';
        if (!under || under === el) return;
        under.dispatchEvent(new e.constructor(e.type, {
          bubbles: true,
          cancelable: true,
          composed: true,
          view: window,
          detail: e.detail,
          clientX: e.clientX,
          clientY: e.clientY,
          screenX: e.screenX,
          screenY: e.screenY,
          button: e.button,
          buttons: e.buttons,
          pointerId: e.pointerId,
          pointerType: e.pointerType,
          isPrimary: e.isPrimary,
        }));
      }
      function sizeAutofillForm() {
        if (!active) return; // dormant off auth screens (perf gate above)
        var focused = document.querySelector(
            'form input.flt-text-editing, form textarea.flt-text-editing');
        if (!focused || !focused.form) return;
        var rect = focused.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        var fields = Array.prototype.filter.call(
            focused.form.querySelectorAll('input, textarea'),
            function (el) { return el.type !== 'submit'; });
        var focusedIdx = fields.indexOf(focused);
        var minY = rect.top;
        var maxY = rect.top + rect.height;
        fields.forEach(function (el, i) {
          if (!diagnosed.has(el)) {
            diagnosed.add(el);
            el.addEventListener('input', logFillEvent);
            el.addEventListener('change', logFillEvent);
          }
          // Chrome paints an opaque pale-blue -internal-autofill-selected
          // background (and forces text color) on autofilled inputs — a UA
          // style that ignores background:transparent, which turned filled
          // fields into blue bars covering the canvas text. The endless
          // background transition is the standard way to keep it from ever
          // appearing; text-fill-color keeps the DOM text invisible so only
          // the canvas-rendered text shows.
          if (!el.style.transition) {
            el.style.transition =
                'background-color 600000s 0s, background-image 600000s 0s';
            el.style.webkitTextFillColor = 'transparent';
          }
          var y = rect.top + (i - focusedIdx) * (rect.height + 40);
          if (el !== focused) {
            if (el.offsetWidth <= 0 && el.offsetHeight <= 0) {
              el.style.position = 'absolute';
              el.style.top = '0px';
              el.style.left = '0px';
              el.style.transform =
                  'translate(' + rect.left + 'px, ' + y + 'px)';
              el.style.width = rect.width + 'px';
              el.style.height = rect.height + 'px';
            } else {
              y = el.getBoundingClientRect().top;
            }
            // pe:auto (not none) so elementFromPoint returns the field and
            // the extensions' occlusion check passes; the pointer listeners
            // hand real user clicks back to the engine.
            el.style.pointerEvents = 'auto';
            if (!forwarded.has(el)) {
              forwarded.add(el);
              el.addEventListener('pointerdown', forwardToFlutter);
              el.addEventListener('pointerup', forwardToFlutter);
            }
          }
          minY = Math.min(minY, y);
          maxY = Math.max(maxY, y + rect.height);
        });
        // Extensions treat 0x0 forms as hidden/honeypot forms and skip
        // their fields — give the form itself a real size. It must stay
        // static AND unmargined at its natural spot: positioning it would
        // make it the containing block for the engine's absolutely-placed
        // inputs, and empirically even margins break the engine's
        // focus-switch between fields. pointer-events:none keeps the sized
        // box click-transparent; inputs win pe back explicitly above.
        var form = focused.form;
        if (form.offsetWidth <= 0 || form.offsetHeight <= 0) {
          form.style.width = rect.width + 'px';
          form.style.height = (maxY - minY) + 'px';
          form.style.pointerEvents = 'none';
        }
        if (getComputedStyle(focused).pointerEvents === 'none') {
          focused.style.pointerEvents = 'auto';
        }
      }
      // Run synchronously inside the observer callback: our observer is
      // registered before extension content scripts, so the fields are
      // already sized when the extension's own observer sees the same
      // mutation batch and analyzes the form. The observer stays
      // registered permanently to preserve that ordering guarantee — the
      // `active` gate (not observer teardown) is what makes non-auth
      // screens cheap.
      new MutationObserver(function () {
        if (!active) return; // dormant: one boolean read per mutation batch
        sizeAutofillForm();
      }).observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['style', 'class'],
      });
      // Activation: permanent capture-phase focusin listener (event-driven,
      // cheap). Auth-screen text fields are the only ones Flutter mounts
      // inside a flt-text-editing-host <form> (AutofillGroup), so a focusin
      // with that probe present means an auth screen is up: wake the shim
      // and start the relay poll. Focus lands synchronously in the same
      // task that inserts the form, so the fields are sized here before
      // any observer (ours or an extension's) processes that mutation
      // batch — the ordering guarantee above still holds while gated.
      document.addEventListener('focusin', function () {
        if (!active && document.querySelector(AUTOFILL_PROBE)) {
          active = true;
          idleTicks = 0;
          if (relayTimer === null) relayTimer = setInterval(relayTick, 200);
        }
        sizeAutofillForm();
      }, true);
    })();
  </script>

  <!-- Flutter initialization: build-generated bootstrap (inlines the loader,
       the build config, and the injected service-worker version — verified in
       build/web/flutter_bootstrap.js). Replaces the deprecated
       serviceWorkerVersion/loadEntrypoint pattern, which Flutter 3.35 warns
       about at build time. -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
