name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual deploy/rollback: run the workflow on main with the git SHA of a
  # previously pushed image (CI tags every main image with its SHA). The
  # build-push job is skipped on dispatch — only deploy runs, pointing the
  # server at the requested tag.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (git SHA of a previous green main build)"
        required: true
        type: string

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never a main run: killing one mid-deploy
  # could interrupt the ssh step on the server. Main runs queue instead
  # (GitHub keeps only the newest pending run), preserving deploy order.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Raising the service worker's manifest cache name spends a ONE-SHOT eviction:
  # activate() takes its no-prior-manifest branch and calls
  # caches.delete(CACHE_NAME) exactly once per client, unrepeatably. Spent while
  # Cloudflare is serving stale bytes, it refills every client FROM the stale
  # edge — turning a shipped fix into a wider outage. That has now been paid for
  # twice (v2 with #426, v3 with #447), both times because the precondition
  # lived in a PR description, and a description is a convention someone has to
  # remember at the moment of merging.
  #
  # So a PR that raises the suffix has to show the production edge agrees with
  # the origin. PRs that don't touch it exit in a second, without a network call.
  #
  # Known blind spot, stated rather than implied: Cloudflare caches per data
  # center, so a green here proves the PoP this runner reached — not every PoP.
  # It is a tripwire, not a proof. The runbook (dockerize/production/README.md)
  # is still the authority: purge first, then merge.
  sw-manifest-bump-guard:
    name: SW manifest bump requires a clean edge
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Does this PR raise the manifest suffix?
        id: suffix
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          file=dockerize/deployment/Dockerfile
          head=$(grep -oE 'flutter-app-manifest-v[0-9]+' "$file" | head -1)
          base=$(git show "FETCH_HEAD:$file" | grep -oE 'flutter-app-manifest-v[0-9]+' | head -1)
          echo "base=${base:-<none>}  head=${head:-<none>}"
          if [ "$head" = "$base" ]; then
            echo "unchanged — this PR does not spend the one-shot eviction"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: The edge must be clean before the shot is spent
        if: steps.suffix.outputs.bumped == 'true'
        run: |
          echo "This PR raises the service-worker manifest suffix, which fires a"
          echo "one-shot cache eviction on every client — once, and never again."
          echo "Merged while the edge is stale, it refills every client FROM the"
          echo "stale edge. Checking the production edge now:"
          echo
          ./scripts/verify-edge-parity.sh https://anemos.travel

  go:
    name: Go (fmt, vet, test, sqlc drift)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/packages/api
    services:
      # Separate database from the migrations job's: this one backs the
      # integration test suite (TRUNCATE isolation), that one validates the
      # `go run . migrate` entrypoint against a pristine DB.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/packages/api/go.mod
          cache-dependency-path: src/packages/api/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" && echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/travel_test?sslmode=disable
        run: go test -race ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: sqlc drift check
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- store/

  flutter:
    name: Flutter (analyze, test, build web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/packages/flutter-app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Regenerate the localizations and fail if any message lacks a
      # translation (specs/i18n-spanish). Catches both a missing .arb entry and
      # a committed app_localizations*.dart that drifted from the .arb files —
      # the l10n equivalent of the sqlc drift check on the Go side.
      - name: l10n codegen + translation coverage
        run: |
          flutter gen-l10n
          if [ -s l10n_untranslated.json ] && [ "$(cat l10n_untranslated.json)" != "{}" ]; then
            echo "::error::Untranslated messages:"; cat l10n_untranslated.json; exit 1
          fi
          if ! git diff --quiet -- lib/l10n; then
            echo "::error::Generated localizations are stale — run 'flutter gen-l10n' and commit."
            git diff --stat -- lib/l10n; exit 1
          fi

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos --fatal-warnings

      - name: flutter test
        run: flutter test

      # PR-only: on main the gateway image build (build-push) is the real web
      # build — rebuilding here would be a pure duplicate (~2-3 min). On PRs
      # this is the only web compile, so it runs with the PRODUCTION flags:
      # the old flagless build never exercised --base-href/APP_BASE_PATH,
      # which is the exact parity gap behind the #320 service-worker bug.
      # --wasm mirrors the image build and keeps a dart2wasm-incompatible
      # dependency from landing unnoticed; the dual compile makes this step
      # a few minutes slower on PRs.
      - name: flutter build web (prod-parity compile check)
        if: github.event_name == 'pull_request'
        run: >
          flutter build web
          --wasm
          --base-href /app/
          --dart-define=API_BASE_URL=/api/v1
          --dart-define=APP_BASE_PATH=/app/

  migrations:
    name: Migrations apply from zero
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/packages/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/packages/api/go.mod
          cache-dependency-path: src/packages/api/go.sum

      # Two parallel branches can each add e.g. 00052_*.sql and merge cleanly
      # (different filenames), leaving a duplicate goose version that only
      # explodes at deploy time. The PR checkout is the merge ref, so a
      # branch-vs-main duplicate fails here before it can land.
      - name: Guard against duplicate migration numbers
        run: |
          dups=$(ls migrations/ | grep -oE '^[0-9]{5}' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::error::duplicate migration number(s): $(echo "$dups" | tr '\n' ' ') — two branches took the same number; renumber this branch's migration past main's highest."
            ls migrations/ | grep -E "^($(echo "$dups" | paste -sd'|' -))_"
            exit 1
          fi
          bad=$(ls migrations/ | grep -vE '^[0-9]{5}_[a-z0-9_]+\.sql$' || true)
          if [ -n "$bad" ]; then
            echo "::error::migration filenames must match NNNNN_name.sql:"
            echo "$bad"
            exit 1
          fi

      # A migration numbered at or BELOW main's highest passes every other
      # check here and then takes production down. "Apply migrations" below
      # starts from an empty database, where any ordering is trivially valid,
      # so it cannot see this; the duplicate guard above cannot either, since
      # filling a gap collides with nothing. But db.go runs goose.Up without
      # WithAllowMissing, and goose refuses to apply a version below the
      # database's current max ("found N missing migrations before current
      # version M") — which main.go escalates to log.Fatalf, so the API exits
      # before binding its port and crash-loops with the old container already
      # replaced. Paid for by the 00058 gap (2026-08-14): that number can
      # never be used again, because production is past it.
      - name: Guard against out-of-order migration numbers
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          # Pathspec is relative to this job's working-directory, not the repo
          # root; anchoring it wrong makes main_max empty and the guard passes
          # everything silently.
          main_files=$(git ls-tree --name-only -r origin/main -- migrations/ \
            | sed 's#.*/##' | grep -E '^[0-9]{5}_' | sort)
          main_max=$(printf '%s\n' "$main_files" | grep -oE '^[0-9]{5}' | sort | tail -1)
          if [ -z "$main_max" ]; then
            echo "::error::could not read main's migrations — the guard cannot verify ordering, so failing closed."
            exit 1
          fi
          added=$(comm -13 <(printf '%s\n' "$main_files") <(ls migrations/ | grep -E '^[0-9]{5}_' | sort))
          if [ -z "$added" ]; then
            echo "no migrations added against main (highest on main: $main_max)"
            exit 0
          fi
          rc=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            n=${f%%_*}
            # 10# forces base 10: 00058 is not a valid octal literal.
            if [ "$((10#$n))" -le "$((10#$main_max))" ]; then
              echo "::error::migration $f is numbered $n, at or below main's highest ($main_max). Production has already applied past it, so goose would refuse it at boot and the deploy would crash-loop. Renumber it above $main_max."
              rc=1
            fi
          done <<< "$added"
          if [ "$rc" -eq 0 ]; then
            echo "added migration(s) sort above main's highest ($main_max):"
            printf '%s\n' "$added" | sed 's/^/  /'
          fi
          exit $rc

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/travel?sslmode=disable
        run: go run . migrate

  build-push:
    name: Build & push images (GHCR)
    runs-on: ubuntu-latest
    # The gateway image includes a full Flutter web build (~several minutes).
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, flutter, migrations]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same context/dockerfile the deployment compose uses for the api
      # service (dockerize/deployment/docker-compose.yml).
      - name: Build & push api image
        uses: docker/build-push-action@v6
        with:
          context: src/packages/api
          file: src/packages/api/Dockerfile
          # Production is an amd64 VPS (DigitalOcean); re-add linux/arm64 (plus the
          # setup-qemu-action step) if an ARM host ever returns.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/golden-tempo/goldentempo-api:latest
            ghcr.io/golden-tempo/goldentempo-api:${{ github.sha }}
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # The gateway Dockerfile COPYs both src/packages/flutter-app/ and
      # dockerize/ paths, so its context is the repo root.
      - name: Build & push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerize/deployment/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/golden-tempo/goldentempo-gateway:latest
            ghcr.io/golden-tempo/goldentempo-gateway:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=gateway
          # mode=max (export ALL stages) is deliberate for both scopes: the
          # layers worth caching are precisely the builder-stage ones (apt,
          # flutter clone, web-only precache, pub get / go mod download);
          # mode=min would export only the tiny final stages and force a full
          # toolchain rebuild every main push. The web-only precache keeps the
          # exported stage well inside the repo's 10 GB Actions cache budget.
          cache-to: type=gha,mode=max,scope=gateway

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-push
    # Two ways in:
    #   - push to main with a successful build-push (normal deploy of the
    #     freshly pushed :<sha> images);
    #   - workflow_dispatch on main (manual deploy/rollback of an existing
    #     tag; build-push is skipped, hence the explicit result check and
    #     !cancelled() to override the implicit success() gate).
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          ((github.event_name == 'push' && needs.build-push.result == 'success') ||
           github.event_name == 'workflow_dispatch') }}
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.sha }}
    steps:
      # The production host is a cloud VPS behind a Cloudflare Tunnel, so
      # there is no publicly routable SSH port: every ssh/rsync below goes
      # through `cloudflared access ssh` against the tunnel's SSH hostname
      # (DEPLOY_HOST, e.g. ssh.goldentempotravel.com), authenticated by a
      # Cloudflare Access service token (CF_ACCESS_*) on top of the normal
      # SSH keypair. Until all five secrets exist this job self-skips with a
      # notice instead of failing, so main CI stays green. Delete this gate
      # once the secrets exist, if you want missing config to be loud.
      - name: Check deploy secrets
        id: gate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ] \
             || [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::notice::deploy secrets not configured — skipping deploy (launch runbook step 3)"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$IMAGE_TAG" in
            (*[!A-Za-z0-9._-]*|"")
              echo "::error::invalid IMAGE_TAG '$IMAGE_TAG' (expected a git SHA / docker tag)"
              exit 1 ;;
          esac
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.configured == 'true'

      - uses: webfactory/ssh-agent@v0.9.0
        if: steps.gate.outputs.configured == 'true'
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # cloudflared provides the transport: ssh can't reach the Pi directly,
      # so a ProxyCommand pipes each connection through the tunnel's SSH
      # hostname, authorized by the Access service token (the
      # TUNNEL_SERVICE_TOKEN_* env vars cloudflared reads).
      - name: Install cloudflared and configure SSH via Cloudflare Access
        if: steps.gate.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          sudo curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${DEPLOY_HOST}
            User deploy
            ProxyCommand cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      # Everything under dockerize/production/ that's in git (compose, nginx
      # confs, README). No --delete: /opt/goldentempo/ also holds the .env,
      # .image_tag, and backups/ that must never be touched from CI.
      - name: Sync production stack files
        if: steps.gate.outputs.configured == 'true'
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: rsync -rtvz dockerize/production/ "deploy-target:/opt/goldentempo/"

      # Record what's live in BOTH places manual operations read: .image_tag
      # (the runbook's explicit source) and the IMAGE_TAG pin in .env, which
      # compose interpolation reads automatically. Refreshing the .env pin is
      # what makes a bare `docker compose up -d` on the host safe — before
      # this, the pin went stale on every deploy and a manual recreate
      # silently rolled the stack back to the old image (2026-08-01 incident).
      # The gate step's IMAGE_TAG charset check ([A-Za-z0-9._-]) keeps the
      # sed replacement injection-free.
      #
      # `compose up` runs DETACHED (setsid + nohup, all fds redirected):
      # this SSH session arrives through the cloudflared tunnel, so if the
      # deploy recreates the cloudflared container (e.g. a version-pin bump
      # in docker-compose.yml), the session is severed the moment the old
      # cloudflared stops. Inline, that killed `up` between "remove old" and
      # "start new" and left the stack down with no way back in (2026-07-23
      # Pi incident). Detached, the recreate finishes on the host and the
      # tunnel returns on its own; the Verify step below is the real success
      # gate either way. If verify then fails, the up's output is in
      # /opt/goldentempo/deploy-up.log (fetched by the step after it).
      - name: Pull images and restart stack
        if: steps.gate.outputs.configured == 'true'
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ssh deploy-target "set -eu
            cd /opt/goldentempo
            printf 'IMAGE_TAG=%s\n' '${IMAGE_TAG}' > .image_tag
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/' .env
            else
              printf 'IMAGE_TAG=%s\n' '${IMAGE_TAG}' >> .env
            fi
            export IMAGE_TAG='${IMAGE_TAG}'
            docker compose pull
            rm -f deploy-up.log
            setsid nohup sh -c 'docker compose up -d --remove-orphans && docker image prune -f' \
              </dev/null >deploy-up.log 2>&1 &
            echo 'compose up dispatched (detached); see Verify step / deploy-up.log'"

      # A green deploy should mean "this SHA is live and serving", not just
      # "the restart script ran": poll the public site until both the api
      # (health.release, baked from SENTRY_RELEASE) and the web build
      # (/app/version.json, baked from GIT_SHA) report the deployed tag.
      # No curl -f: a degraded-DB health still answers 503 WITH the release
      # in the body, and that still proves which build is serving. The query
      # string busts Cloudflare's edge cache for version.json. Note:
      # rollbacks (workflow_dispatch) to images built before these markers
      # existed will fail this step — deploy them with the pre-marker
      # workflow revision if ever needed.
      - name: Verify deployed release
        if: steps.gate.outputs.configured == 'true'
        run: |
          for i in $(seq 1 30); do
            api=$(curl -sS -m 10 "https://anemos.travel/api/v1/health" \
              | jq -r '.release // empty' 2>/dev/null || true)
            web=$(curl -sS -m 10 "https://anemos.travel/app/version.json?deploy=${IMAGE_TAG}" \
              | jq -r '.release // empty' 2>/dev/null || true)
            if [ "$api" = "$IMAGE_TAG" ] && [ "$web" = "$IMAGE_TAG" ]; then
              echo "live: api and web both serving ${IMAGE_TAG}"
              exit 0
            fi
            echo "waiting: api='${api:-?}' web='${web:-?}' want='${IMAGE_TAG}' (attempt $i/30)"
            sleep 10
          done
          echo "::error::deployed release never became ${IMAGE_TAG}"
          exit 1

      # The step above proves the new build is LIVE. It cannot prove a browser
      # will RECEIVE it: it appends ?deploy=${IMAGE_TAG}, and a query string is
      # always a cache miss at the edge, so it asks for exactly the URLs
      # Cloudflare is not answering. /app/assets/** is the opposite case —
      # stable URLs whose bytes change on every deploy, since flutter build web
      # does not content-hash asset filenames — which is why nginx serves that
      # tree `no-cache`. If anything re-pins it, the edge keeps serving
      # pre-change bytes while every other signal stays green. That is not
      # hypothetical: 2026-08-14..16, Cloudflare held a stale icon font under a
      # one-year TTL and three icons rendered blank in production for two days
      # and ~15 deploys, through a fix that had already shipped.
      #
      # Re-checked once before failing: right after a deploy the edge may still
      # be filling, and a single dropped fetch should not redden a good deploy.
      - name: Verify edge serves what origin serves
        if: steps.gate.outputs.configured == 'true'
        run: |
          ./scripts/verify-edge-parity.sh https://anemos.travel && exit 0
          echo "re-checking in 20s (the edge may still be filling)"
          sleep 20
          ./scripts/verify-edge-parity.sh https://anemos.travel

      # When verify fails, the detached up's output on the host is the first
      # place to look — and by this point the tunnel is usually back even if
      # the deploy recreated cloudflared. Best-effort: if the tunnel is still
      # down this step can't help, and the DO web console is the way in.
      - name: Fetch deploy-up.log on failure
        if: failure() && steps.gate.outputs.configured == 'true'
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ssh -o ConnectTimeout=15 deploy-target \
            "cd /opt/goldentempo && tail -100 deploy-up.log; docker compose ps -a" || true
