# Shared gateway location set — included at *server* scope by both the
# deployment :80 server (nginx/default.conf) and the production :443 TLS
# server (dockerize/production/nginx/prod.conf). Keep anything server-shape
# specific (listen/server_name/ssl) out of this file.
#
# Depends on the $share_prerender map defined in share-prerender-map.conf
# (http scope — maps are not allowed inside server blocks).

root /usr/share/nginx/html;
index index.html;

# Server-scope security headers. Locations WITHOUT their own add_header (/api/,
# the legal pages, robots/sitemap, the `/` redirect) inherit these; the app
# blocks below that define their own add_header re-include the snippet, since
# nginx stops inheriting add_header once a level sets any of its own.
include /etc/nginx/snippets/security-headers.conf;

location /api/ {
    # api_backend (nginx/perf.conf) keeps a keepalive pool to the Go API;
    # clearing the Connection header is required for upstream keepalive
    # over HTTP/1.1 (nginx otherwise sends "Connection: close").
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Above nginx's 1 MiB default for /transcribe audio clips and /plan
    # image attachments; the Go bodyLimitMiddleware enforces the real
    # per-endpoint caps (widest lane: 20 MiB for /plan).
    client_max_body_size 20m;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # REPLACE (not append) X-Forwarded-For with the single peer address this
    # gateway vouches for. The Go rate limiter (ratelimit.go clientIP) takes
    # the RIGHTMOST XFF entry; appending would make that entry whatever peer
    # dialed nginx — behind Cloudflare that is a CF edge IP, collapsing all
    # users into shared rate-limit buckets. In production the realip module
    # (production/nginx/cloudflare-realip.conf) has already rewritten
    # $remote_addr to CF-Connecting-IP for connections from Cloudflare's
    # ranges; direct peers keep their socket IP, so the value stays
    # unspoofable either way. In the deployment stack (no realip conf)
    # $remote_addr is nginx's actual peer — the same value
    # $proxy_add_x_forwarded_for used to put rightmost.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Dedicated SSE lane for the /plan agent stream. Exact match wins over the
# /api/ prefix block above, so this — not /api/ — serves the one endpoint
# that streams tokens: response buffering off (no token stutter), request
# buffering ON (see below), and timeouts of 660s so the gateway outlives
# planMaxDuration (10 min) in plan_handler.go instead of severing long
# tool-heavy turns.
location = /api/v1/plan {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    # Request buffering deliberately ON (the default): the upstream commits
    # its SSE response within microseconds of the request headers, and with
    # unbuffered forwarding nginx stops relaying the request body once the
    # upstream responds — the Go decoder then reads EOF and every request
    # fails (2026-08-12 prod incident, fix for b476b79). Buffering also
    # absorbs slow client uploads (Go's ReadTimeout is 15s) and keeps POST
    # bodies replayable if a pooled keepalive upstream connection has gone
    # stale.
    proxy_request_buffering on;
    chunked_transfer_encoding off;
    client_max_body_size 20m;
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # REPLACE (not append) X-Forwarded-For with the single peer address this
    # gateway vouches for. The Go rate limiter (ratelimit.go clientIP) takes
    # the RIGHTMOST XFF entry; appending would make that entry whatever peer
    # dialed nginx — behind Cloudflare that is a CF edge IP, collapsing all
    # users into shared rate-limit buckets. In production the realip module
    # (production/nginx/cloudflare-realip.conf) has already rewritten
    # $remote_addr to CF-Connecting-IP for connections from Cloudflare's
    # ranges; direct peers keep their socket IP, so the value stays
    # unspoofable either way. In the deployment stack (no realip conf)
    # $remote_addr is nginx's actual peer — the same value
    # $proxy_add_x_forwarded_for used to put rightmost.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# MCP connector (specs/mcp-connector). Root-level because ChatGPT/claude.ai
# take a connector URL typed by hand and /api/v1 would be noise, and because
# the discovery documents are fixed by RFC 9728/8414 at /.well-known/.
#
# Streamable HTTP responses can be SSE, so buffering is off and the read
# timeout clears the MCP client's 300s ceiling. XFF is REPLACED for the same
# reason as /api/ above.
location = /mcp {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Only the two OAuth discovery documents (plus the openid alias) are proxied —
# NOT all of /.well-known/, which stays free for ACME, apple-app-site-
# association, and friends.
location = /.well-known/oauth-protected-resource {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /.well-known/oauth-protected-resource/mcp {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /.well-known/oauth-authorization-server {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /.well-known/openid-configuration {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Must precede the generic /app/ block. `if` here is the documented-safe
# rewrite-only form; `last` re-enters location matching and lands in the
# /api/ proxy above. Headers repeated: nested blocks don't inherit
# add_header from siblings.
location ~ ^/app/share/ {
    if ($share_prerender) {
        rewrite ^/app/share/(.*)$ /api/v1/share-preview/$1 last;
    }
    try_files $uri /app/index.html;

    add_header Cross-Origin-Embedder-Policy require-corp;
    add_header Cross-Origin-Opener-Policy same-origin;
    include /etc/nginx/snippets/security-headers.conf;
}

location /app/ {
    try_files $uri $uri/ /app/index.html;

    add_header Cross-Origin-Embedder-Policy require-corp;
    add_header Cross-Origin-Opener-Policy same-origin;
    include /etc/nginx/snippets/security-headers.conf;
}

# App-shell files that change IN PLACE on every deploy — flutter build does
# NOT content-hash their filenames (verified against a real build/web output),
# so they must never be immutable. `no-cache` (not no-store) lets browsers
# keep a copy but forces ETag revalidation. index.html is also the try_files
# fallback for /app/ deep links and bare /app/, which land here via internal
# redirect. Headers repeated: add_header is not inherited between blocks.
#
# What the CLIENT actually sees is split, because Cloudflare's Browser Cache
# TTL (4 h default) rewrites `no-cache` for any extension it caches:
# index.html/version.json/manifest.json are `.html`/`.json`, which Cloudflare
# does not cache, so they arrive `no-cache` intact; the .js members arrive
# `max-age=14400`, and main.dart.wasm/.mjs — the dart2wasm build's
# entrypoints, equally uncontent-hashed and rewritten in place by every
# deploy — get whatever Cloudflare's cached-extension list says on the day.
# The edge revalidates against us either way, so a new deploy is always
# available — but a returning browser can hold a member for up to 4 h.
# Nearly all are immune anyway: main.dart.js, main.dart.wasm and
# main.dart.mjs sit in the service worker's CORE list (alongside index.html
# and flutter_bootstrap.js), which install() fetches with {'cache':
# 'reload'}, and flutter_service_worker.js is exempt because browsers
# bypass the HTTP cache when checking a worker script for updates. Only
# flutter.js is genuinely exposed, and it is SDK loader boilerplate that
# changes on Flutter upgrades. Do not drop a file from CORE while relying on
# this block alone.
location ~ ^/app/(?:index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|main\.dart\.js|main\.dart\.wasm|main\.dart\.mjs|flutter\.js|version\.json|manifest\.json)$ {
    add_header Cache-Control "no-cache";
    add_header Cross-Origin-Embedder-Policy require-corp;
    add_header Cross-Origin-Opener-Policy same-origin;
    include /etc/nginx/snippets/security-headers.conf;
}

# Service-worker-managed resource trees (fonts live under assets/). These are
# NEVER `immutable`: flutter build web does not content-hash these filenames,
# so the URLs are stable while the BYTES change on any deploy that alters the
# asset set — notably MaterialIcons-Regular.otf, which --release re-tree-shakes
# to only the codepoints the code statically references.
#
# This block used to pin them for a year and delegate versioning to
# flutter_service_worker.js. That does not work, and the failure is silent and
# permanent. The service worker CAN detect the change — activate() drops an
# entry whose manifest hash moved — but it then re-downloads with a
# DEFAULT-mode fetch, which is answered by the browser HTTP cache and by
# Cloudflare: the very caches this header just pinned. It stores the STALE
# bytes under the NEW hash, and no future deploy will ever evict them, because
# the hash is now "correct". Staleness becomes self-certifying.
# Cost, 2026-08-14: Cloudflare served a pre-#419 icon font for five deploys and
# three icons rendered blank in prod (settings, calendar_month, edit_calendar).
#
# `no-cache` (not no-store) keeps the browser copy but forces ETag
# revalidation. The service-worker cache is the real long-lived cache for
# repeat visitors — the HTTP layer's only job is to not defeat its
# invalidation. A short max-age is NOT a middle ground: because the SW cache is
# sticky, any nonzero TTL turns a brief serving window into permanent
# corruption for every client that loads inside it.
#
# canvaskit/ is included deliberately. Today it is never requested —
# flutter_bootstrap.js carries no useLocalCanvasKit, so CanvasKit loads from
# gstatic — but flipping to local CanvasKit under `immutable` would pin a 7 MB
# wasm against a fresh main.dart.js, which is a white screen rather than a
# missing glyph. Disarmed in advance, at zero measured cost.
#
# Anything that used to match a blanket *.js/*.css/... extension rule (e.g.
# favicon.png, splash/) falls through to the /app/ prefix block and gets
# default ETag-validated caching.
#
# NOTE: Cloudflare's Browser Cache TTL (4 h default) rewrites a `no-cache`
# response into `max-age=14400` for the browser whenever the extension is one
# it caches — the edge still revalidates against us, so the edge cannot go
# stale, and the service worker's {cache: "reload"} fetch (see the Dockerfile
# patch) bypasses that browser copy, so it cannot poison the SW cache either.
# The residual is cosmetic: returning visitors may run a build up to 4 h old.
# Setting Browser Cache TTL to "Respect Existing Headers" removes it.
#
# "The edge cannot go stale" is a claim about objects the CDN stores from HERE
# ON. It says nothing about objects it stored EARLIER: a cached response keeps
# the freshness lifetime it was stored with, so everything Cloudflare picked up
# while this block still said `immutable` stays pinned until 2027 and is never
# revalidated. Editing this header does not evict them — only a purge does.
# That gap is how the 2026-08-14 icon outage outlived its own fix by two days
# and ~15 deploys. scripts/verify-edge-parity.sh now asserts edge bytes ==
# origin bytes on every deploy, so this can never again be believed-fixed while
# users still see the old bytes.
location ~ ^/app/(?:assets|canvaskit|icons)/ {
    add_header Cache-Control "no-cache";
    add_header Cross-Origin-Embedder-Policy require-corp;
    add_header Cross-Origin-Opener-Policy same-origin;
    include /etc/nginx/snippets/security-headers.conf;
}

# Legal pages — static HTML, shared source of truth in dockerize/static/
# (copied into this image; the development gateway mounts the same
# directory so /privacy and /terms behave identically on :3000).
location = /privacy {
    default_type text/html;
    alias /usr/share/nginx/html/static/privacy.html;
}

location = /terms {
    default_type text/html;
    alias /usr/share/nginx/html/static/terms.html;
}

# Connector documentation + support landing page (required listing fields for
# the ChatGPT plugin directory). Exact-match only: /connect/<request-token> is
# the Flutter OAuth consent route and must keep falling through to the app.
location = /connectors {
    default_type text/html;
    alias /usr/share/nginx/html/static/connectors.html;
}

# SEO plumbing — same shared static directory as the legal pages.
location = /robots.txt {
    default_type text/plain;
    alias /usr/share/nginx/html/static/robots.txt;
}

location = /sitemap.xml {
    # Empty types{} so default_type wins; mime.types maps .xml to the
    # older text/xml.
    types {}
    default_type application/xml;
    alias /usr/share/nginx/html/static/sitemap.xml;
}

location = / {
    return 301 /app/;
}

location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
}
